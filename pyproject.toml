[project]
name = "trec-mlm-2026"
version = "0.1.0"
description = "TREC 2026 Million LLMs experiments and analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gdown>=6.0.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.6",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=5.1.0,<6",
    "torch>=2.7.0",
]
dense-aggregation = [
    "numpy==2.5.1; python_version >= '3.12'",
    "scipy==1.18.0; python_version >= '3.12'",
    "scikit-learn==1.9.0",
    "threadpoolctl==3.6.0",
]
response = [
    "bm25s==0.3.9",
    "PyStemmer==3.1.0",
]

[project.scripts]
trec-mlm = "trec_mlm.cli:main"
trec-mlm-dense-aggregation = "trec_mlm.dense_aggregation_entrypoint:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trec_mlm"
module-root = ""

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

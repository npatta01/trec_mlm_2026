quarto-required: "1.9.38"
project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "start-here/*.qmd"
    - "background/*.qmd"
    - "data/*.qmd"
    - "questions/*.qmd"
    - "studies/*.qmd"
    - "ideas/*.qmd"
    - "approaches/*.qmd"
    - "protocols/*.qmd"
    - "evidence/*.qmd"
    - "generated/runs/*.qmd"
  resources:
    - assets/ledger.js
website:
  title: "TREC 2026 Research Hub"
  search: true
  navbar:
    left:
      - text: "Start Here"
        href: start-here/index.qmd
      - text: "Background"
        href: background/index.qmd
      - text: "Data"
        href: data/index.qmd
      - text: "Research"
        menu:
          - text: "Questions"
            href: questions/index.qmd
          - text: "Studies"
            href: studies/index.qmd
          - text: "Ideas & Tests"
            href: ideas/index.qmd
          - text: "Approaches"
            href: approaches/index.qmd
      - text: "Protocols"
        href: protocols/index.qmd
      - text: "Evidence"
        menu:
          - text: "Coverage"
            href: evidence/coverage.qmd
          - text: "History"
            href: evidence/history.qmd
          - text: "Runs"
            href: evidence/runs.qmd
format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [darkly, assets/theme.scss]
    html-math-method: plain
    toc: true
    anchor-sections: true
    smooth-scroll: true
    link-external-icon: true
execute:
  enabled: false
